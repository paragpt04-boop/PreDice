services:
  predice:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      PREDICE_TOKEN: ${PREDICE_TOKEN:?Set a private random access token}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    volumes:
      - predice-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  predice-data:
